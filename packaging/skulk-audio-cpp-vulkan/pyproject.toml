[project]
name = "skulk-audio-cpp-vulkan"
version = "0.8.2.post1"
description = "Pinned audio.cpp Vulkan music server for Skulk on Linux"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
skulk-audio-cpp-vulkan = "skulk_audio_cpp_vulkan:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skulk_audio_cpp_vulkan"]
artifacts = [
  "src/skulk_audio_cpp_vulkan/bin/**",
  "src/skulk_audio_cpp_vulkan/model_specs/**",
  "src/skulk_audio_cpp_vulkan/licenses/**",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
