# The pip-installable Vulkan llama-server engine (#614 engine provisioning).
#
# Sibling of skulk-llama-server-cuda with a simpler runtime story: the wheel
# bundles the Khronos Vulkan loader (libvulkan, Apache-2.0, freely
# redistributable) next to the binary, so the only system prerequisite is the
# GPU driver's Vulkan ICD (mesa-vulkan-drivers on AMD, the NVIDIA driver's
# ICD on bare-metal NVIDIA). No dependencies at all.
#
# Built from the pinned upstream llama.cpp source in our own CI (supply-chain
# posture: we trust upstream's code at a tag, not their binary artifacts).
# Version scheme: 0.<llama.cpp build>.<packaging revision>, in lockstep with
# the CUDA wheel and src/skulk/provisioning/manifest.py (enforced by the
# engine-wheel workflow guard).

[project]
name = "skulk-llama-server-vulkan"
version = "0.10092.0"
description = "Pinned Vulkan llama-server build for Skulk's served GGUF engine (Linux x86_64)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
llama-server-vulkan = "skulk_llama_server_vulkan:main"
ggml-rpc-server-vulkan = "skulk_llama_server_vulkan:rpc_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skulk_llama_server_vulkan"]
artifacts = ["src/skulk_llama_server_vulkan/bin/**", "src/skulk_llama_server_vulkan/licenses/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
