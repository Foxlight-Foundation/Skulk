[project]
name = "skulk-audio-cpp-cpu"
version = "0.8.2.post0"
description = "Pinned audio.cpp music server for Skulk on supported CPU hosts"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
skulk-audio-cpp-cpu = "skulk_audio_cpp_cpu:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skulk_audio_cpp_cpu"]
artifacts = [
  "src/skulk_audio_cpp_cpu/bin/**",
  "src/skulk_audio_cpp_cpu/model_specs/**",
  "src/skulk_audio_cpp_cpu/licenses/**",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
