name: ci-pipeline

on:
  push:
    branches:
      - staging
      - main
      - dev
  pull_request:
    branches:
      - staging
      - main
      - dev

jobs:
  wire-compat-guard:
    # Any PR touching the networking crate's wire surfaces must either bump
    # NETWORK_VERSION or record a wire-neutral entry in WIRE_COMPAT.md
    # (#659). The pnet key derives from NETWORK_VERSION, so an unbumped wire
    # change makes incompatible builds half-work instead of failing loudly
    # at connect; the 31e3f333 telemetry-isolation change shipped that way
    # and produced a fully-synced node invisible to membership.
    name: Wire compatibility guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require NETWORK_VERSION bump or WIRE_COMPAT entry
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          wire_files="rust/networking/src/swarm.rs rust/networking/src/discovery.rs rust/networking/src/zenoh_session.rs"
          # shellcheck disable=SC2086
          touched=$(git diff --name-only "$base"...HEAD -- $wire_files)
          if [ -z "$touched" ]; then
            echo "no wire-surface files touched; guard passes"
            exit 0
          fi
          echo "wire-surface files touched:"; echo "$touched"
          if git diff "$base"...HEAD -- rust/networking/src/swarm.rs | grep -q "NETWORK_VERSION"; then
            echo "NETWORK_VERSION changed; guard passes"
            exit 0
          fi
          if git diff --name-only "$base"...HEAD -- rust/networking/WIRE_COMPAT.md | grep -q .; then
            echo "WIRE_COMPAT.md updated (wire-neutral change recorded); guard passes"
            exit 0
          fi
          echo "::error::This PR touches rust/networking wire surfaces without bumping NETWORK_VERSION (rust/networking/src/swarm.rs) or recording a wire-neutral entry in rust/networking/WIRE_COMPAT.md. Wire-behavior changes MUST bump the version (the pnet key derives from it, making incompatible builds fail loudly at connect); provably wire-neutral changes (comments, timing, logging) add a WIRE_COMPAT.md entry instead. See rust/networking/WIRE_COMPAT.md for the doctrine."
          exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check

  dashboard-test:
    name: Dashboard browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-react/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard-react
        run: npm ci

      - name: Install Chromium
        working-directory: dashboard-react
        run: npx playwright install --with-deps chromium

      - name: Run dashboard browser tests
        working-directory: dashboard-react
        run: npm run test

  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        env:
          SKULK_TESTS: "1"
          SKULK_DASHBOARD_DIR: ${{ github.workspace }}/dashboard-react/dist/
          SKULK_RESOURCES_DIR: ${{ github.workspace }}/resources
        run: uv run pytest src -m "not slow" --import-mode=importlib
