name: ci-pipeline

on:
  push:
    branches:
      - staging
      - main
      - dev
  pull_request:
    branches:
      - staging
      - main
      - dev

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check

  dashboard-test:
    name: Dashboard browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-react/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard-react
        run: npm ci

      - name: Install Chromium
        working-directory: dashboard-react
        run: npx playwright install --with-deps chromium

      - name: Run dashboard browser tests
        working-directory: dashboard-react
        run: npm run test

  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        env:
          SKULK_TESTS: "1"
          SKULK_DASHBOARD_DIR: ${{ github.workspace }}/dashboard-react/dist/
          SKULK_RESOURCES_DIR: ${{ github.workspace }}/resources
        run: uv run pytest src -m "not slow" --import-mode=importlib
