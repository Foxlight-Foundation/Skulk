name: Native ACE music packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ace-step-native-boundary.yml'
      - 'packaging/skulk-ace-step/**'
      - 'packaging/skulk-demucs/build_wheel.py'
      - 'src/skulk/provisioning/demucs_package.py'
      - 'src/skulk/provisioning/ace_step_runtime.py'
      - 'src/skulk/provisioning/ace_step_manager.py'
      - 'src/skulk/provisioning/native_runtime_manager.py'
      - 'src/skulk/provisioning/demucs_runtime.py'
      - 'src/skulk/provisioning/demucs_manager.py'
      - 'src/skulk/provisioning/native_install_process.py'
      - 'src/skulk/provisioning/_native_install_guard.py'
      - 'src/skulk/utils/process_groups.py'
      - 'src/skulk/utils/runtime_files.py'
      - 'src/skulk/shared/types/native_music.py'
      - 'src/skulk/shared/types/audio_separation.py'
      - 'scripts/stage_ace_step_candidate.py'

permissions:
  contents: read

concurrency:
  group: ace-music-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Offline ACE package execution (${{ matrix.platform }}, ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            variant: cpu
            target: macosx_14_0_arm64
            runner: macos-15
          - platform: linux-amd64
            variant: cpu
            target: manylinux_2_28_x86_64
            runner: ubuntu-24.04
          - platform: linux-arm64
            variant: cpu
            target: manylinux_2_28_aarch64
            runner: ubuntu-24.04-arm
          - platform: linux-amd64
            variant: cuda
            target: manylinux_2_28_x86_64
            runner: ubuntu-24.04
          - platform: linux-arm64
            variant: cuda
            target: manylinux_2_28_aarch64
            runner: ubuntu-24.04-arm
          - platform: linux-amd64
            variant: rocm
            target: linux_x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
      - name: Select an output workspace outside the clean source checkout
        run: printf 'PACKAGE_ROOT=%s/ace-music-package\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Reserve space for the measured GPU archive and expanded-library closure
        if: matrix.variant != 'cpu'
        env:
          ACE_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$ACE_CI_RUNNER_ENVIRONMENT" = github-hosted
          # These SDKs are unused by this standalone Python-wheel job and belong
          # only to the ephemeral hosted runner. Keep self-hosted machines intact.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
          python3 -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= 30*1024**3, "GPU package closure needs 30 GiB free staging space"'
      - name: Prepare independent Core build and bootstrap tools
        run: |
          uv venv --managed-python --python 3.13.13 "$PACKAGE_ROOT/tools"
          uv pip install --python "$PACKAGE_ROOT/tools/bin/python" pydantic==2.12.5 psutil==7.2.1 packaging==26.0 basedpyright==1.37.1 pytest==9.1.1 httpx==0.28.1
          "$PACKAGE_ROOT/tools/bin/python" -c 'import os; assert hasattr(os, "waitid"), "Core requires non-reaping process observation"'
      - name: Check strict build typing and refusal/race regressions
        env:
          PYTHONPATH: packaging/skulk-ace-step
        run: |
          "$PACKAGE_ROOT/tools/bin/basedpyright" --project packaging/skulk-ace-step/pyrightconfig.build.json --pythonpath "$PACKAGE_ROOT/tools/bin/python"
          "$PACKAGE_ROOT/tools/bin/python" -B -m pytest -q -c /dev/null --noconftest -o cache_dir="$PACKAGE_ROOT/producer-test-cache" packaging/skulk-ace-step/producer_tests --basetemp "$PACKAGE_ROOT/producer-tests"
      - name: Stage exact reviewed library source outside the checkout
        run: |
          source_revision=$("$PACKAGE_ROOT/tools/bin/python" -c 'import json; print(json.load(open("packaging/skulk-ace-step/source.json"))["revision"])')
          source_repository=$("$PACKAGE_ROOT/tools/bin/python" -c 'import json; print(json.load(open("packaging/skulk-ace-step/source.json"))["repository"])')
          git init "$PACKAGE_ROOT/source"
          git -C "$PACKAGE_ROOT/source" fetch --depth 1 "$source_repository" "$source_revision"
          git -C "$PACKAGE_ROOT/source" checkout --detach FETCH_HEAD
          test "$(git -C "$PACKAGE_ROOT/source" rev-parse HEAD)" = "$source_revision"
      - name: Fetch exact ROCm pure-metapackage source and build-tool prerequisites
        if: matrix.variant == 'rocm'
        run: |
          "$PACKAGE_ROOT/tools/bin/python" -B packaging/skulk-ace-step/fetch_archives.py '${{ matrix.platform }}' --variant rocm --metapackage-inputs --output "$PACKAGE_ROOT/metapackage-intake"
      - name: Reproduce the pinned pure ROCm metapackage twice offline
        if: matrix.variant == 'rocm'
        run: |
          python_archive=$("$PACKAGE_ROOT/tools/bin/python" -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["PACKAGE_ROOT"])/"metapackage-intake/build-inputs.json").read_text())["python_archive"])')
          source_archive=$("$PACKAGE_ROOT/tools/bin/python" -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["PACKAGE_ROOT"])/"metapackage-intake/build-inputs.json").read_text())["source_archive"])')
          setuptools_wheel=$("$PACKAGE_ROOT/tools/bin/python" -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["PACKAGE_ROOT"])/"metapackage-intake/build-inputs.json").read_text())["setuptools_wheel"])')
          "$PACKAGE_ROOT/tools/bin/python" -B packaging/skulk-ace-step/build_rocm_metapackage.py --repository "$PWD" --builder-profile '${{ matrix.platform }}' --python-archive "$PACKAGE_ROOT/metapackage-intake/$python_archive" --source-archive "$PACKAGE_ROOT/metapackage-intake/$source_archive" --setuptools-wheel "$PACKAGE_ROOT/metapackage-intake/$setuptools_wheel" --output "$PACKAGE_ROOT/metapackage-build"
          mkdir -p "$PACKAGE_ROOT/intake/wheels"
          cp "$PACKAGE_ROOT/metapackage-build/wheels/"*.whl "$PACKAGE_ROOT/intake/wheels/"
          rm -rf "$PACKAGE_ROOT/metapackage-build/tools" "$PACKAGE_ROOT/metapackage-build/interpreter"
      - name: Fetch only exact committed wheel and interpreter objects
        run: |
          "$PACKAGE_ROOT/tools/bin/python" -B packaging/skulk-ace-step/fetch_archives.py '${{ matrix.platform }}' --variant '${{ matrix.variant }}' --output "$PACKAGE_ROOT/intake"
      - name: Build twice and compare complete sealed bytes
        run: |
          python_archive=$(find "$PACKAGE_ROOT/intake/python" -name '*.tar.gz' -type f)
          for build in first second; do
            "$PACKAGE_ROOT/tools/bin/python" -B packaging/skulk-ace-step/build_ace_step.py --repository "$PWD" --source "$PACKAGE_ROOT/source" --wrapper "$PWD/packaging/skulk-ace-step/skulk_ace_step" --wheelhouse "$PACKAGE_ROOT/intake/wheels" --python-archive "$python_archive" --lock "$PWD/packaging/skulk-ace-step/locks/${{ matrix.platform }}-${{ matrix.variant }}-py312.lock" --target '${{ matrix.target }}' --variant '${{ matrix.variant }}' --output "$PACKAGE_ROOT/$build"
          done
          cmp "$PACKAGE_ROOT/first/skulk_ace_step_${{ matrix.variant }}-0.1.0-cp312-cp312-${{ matrix.target }}.whl" "$PACKAGE_ROOT/second/skulk_ace_step_${{ matrix.variant }}-0.1.0-cp312-cp312-${{ matrix.target }}.whl"
          cp "$PACKAGE_ROOT/second/"*.json "$PACKAGE_ROOT/second-build.json"
          rm -rf "$PACKAGE_ROOT/second"
          # The sealed first object already contains every rehashed dependency.
          # Do not keep a third archive copy during the expanded install check.
          rm -rf "$PACKAGE_ROOT/intake/wheels"
      - name: Install fresh offline using Core's actual process supervisor
        env:
          PYTHONPATH: src
        run: |
          package_sha=$("$PACKAGE_ROOT/tools/bin/python" -c 'import json,os,pathlib; print(json.loads(next((pathlib.Path(os.environ["PACKAGE_ROOT"])/"first").glob("*.json")).read_text())["sha256"])')
          "$PACKAGE_ROOT/tools/bin/python" -B scripts/stage_ace_step_candidate.py --wheel "$PACKAGE_ROOT/first/skulk_ace_step_${{ matrix.variant }}-0.1.0-cp312-cp312-${{ matrix.target }}.whl" --sha256 "$package_sha" --variant '${{ matrix.variant }}' --output "$PACKAGE_ROOT/installed"
      - name: Check native typing and execute installed boundary suite
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
          PYTORCH_ENABLE_MPS_FALLBACK: '0'
        run: |
          "$PACKAGE_ROOT/tools/bin/basedpyright" --project packaging/skulk-ace-step/pyrightconfig.json --pythonpath "$PACKAGE_ROOT/installed/runtime/bin/python"
          "$PACKAGE_ROOT/installed/runtime/bin/python" -I -B packaging/skulk-ace-step/verify_runtime.py --variant '${{ matrix.variant }}' > "$PACKAGE_ROOT/native-verification.json"
      - name: Retain exact installed dependency observations
        if: always()
        run: |
          if [[ -x "$PACKAGE_ROOT/installed/runtime/bin/python" ]]; then
            "$PACKAGE_ROOT/installed/runtime/bin/python" -I -B -c 'from importlib.metadata import distributions; print("\n".join(sorted("{}=={}".format(item.metadata["Name"], item.version) for item in distributions())))' > "$PACKAGE_ROOT/native-dependencies.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ace-candidate-${{ matrix.platform }}-${{ matrix.variant }}
          compression-level: 0
          retention-days: 3
          path: |
            ${{ env.PACKAGE_ROOT }}/first/*.whl
            ${{ env.PACKAGE_ROOT }}/first/*.json
            ${{ env.PACKAGE_ROOT }}/intake/wheel-receipt.json
            ${{ env.PACKAGE_ROOT }}/installed/installation.json
            ${{ env.PACKAGE_ROOT }}/installer-diagnostics/**/*.log
            ${{ env.PACKAGE_ROOT }}/native-dependencies.txt
            ${{ env.PACKAGE_ROOT }}/native-verification.json
            ${{ env.PACKAGE_ROOT }}/second-build.json
            ${{ env.PACKAGE_ROOT }}/metapackage-build/provenance.json
