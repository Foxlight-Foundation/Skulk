name: comfy-ltx-wheel

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Promote previously validated candidate bytes without rebuilding
        type: boolean
        default: false
      publish_run_id:
        description: Successful candidate workflow run
        type: string
        default: ""
      publish_sha256:
        description: Exact selected candidate wheel SHA-256
        type: string
        default: ""
  push:
    branches: ["initiative/**", dev, "feature/ltx25-*"]
    paths:
      - ".github/workflows/comfy-ltx-wheel.yml"
      - "packaging/skulk-comfy-ltx/**"
      - "scripts/build_comfy_ltx_wheel.py"
      - "scripts/check_comfy_ltx_reference.py"
      - "scripts/check_comfy_ltx_relay.py"
      - "scripts/check_comfy_ltx_inpaint.py"
      - "scripts/verify_comfy_ltx_promotion.py"

permissions:
  contents: read

jobs:
  candidate:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare locked validation tools and immutable reference source
        run: |
          set -euo pipefail
          uv sync --frozen --group dev
          git init reference-ltx
          git -C reference-ltx remote add origin https://github.com/Lightricks/LTX-2.git
          git -C reference-ltx fetch --depth=1 origin e98f6d927d83c92ef2be6aec76c8440b19306e39
          git -C reference-ltx checkout --detach e98f6d927d83c92ef2be6aec76c8440b19306e39
          mkdir -p .runtime
          git init .runtime/comfy
          git -C .runtime/comfy remote add origin https://github.com/Comfy-Org/ComfyUI.git
          git -C .runtime/comfy fetch --depth=1 origin 40c4fcdf513a4523e39d54a9d391908af8df8171
          git -C .runtime/comfy checkout --detach 40c4fcdf513a4523e39d54a9d391908af8df8171
          git init reference-ltx-comfy
          git -C reference-ltx-comfy remote add origin https://github.com/Lightricks/ComfyUI-LTXVideo.git
          git -C reference-ltx-comfy fetch --depth=1 origin 44c8a36b7c31ee00b4271daed11dc2a4aa481140
          git -C reference-ltx-comfy checkout --detach 44c8a36b7c31ee00b4271daed11dc2a4aa481140
      - name: Build twice and verify typed wheel and numerical contracts
        run: |
          set -euo pipefail
          uv run python scripts/build_comfy_ltx_wheel.py --source packaging/skulk-comfy-ltx --output candidate-wheels
          uv run python scripts/build_comfy_ltx_wheel.py --source packaging/skulk-comfy-ltx --output independent-rebuild
          cmp candidate-wheels/*.whl independent-rebuild/*.whl
          uv run basedpyright --project packaging/skulk-comfy-ltx/pyproject.toml --pythonpath .venv/bin/python
          uv run pytest -q packaging/skulk-comfy-ltx/tests scripts/tests/test_comfy_ltx_wheel.py src/skulk/provisioning/tests/test_comfy_extension.py
          uv run python -m scripts.check_comfy_ltx_reference --ltx-source reference-ltx --comfy-source .runtime/comfy --ltx-comfy-source reference-ltx-comfy \
            --wheel candidate-wheels/skulk_comfy_ltx-0.1.6-py3-none-any.whl --output candidate-wheels/reference-check.json
          uv run python -I -B -c 'import sys; sys.path.insert(0,sys.argv[1]); from skulk_comfy_ltx import manifest_json; assert manifest_json(); assert "torch" not in sys.modules and "comfy" not in sys.modules' \
            candidate-wheels/skulk_comfy_ltx-0.1.6-py3-none-any.whl
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: candidate-wheels/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: comfy-ltx-candidate
          path: candidate-wheels/*
          if-no-files-found: error

  publish-index:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
    concurrency:
      group: foxlight-engine-wheel-index-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate workflow and retain attested source identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.publish_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.path')" = .github/workflows/comfy-ltx-wheel.yml
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha' > source-head.txt
      - uses: actions/download-artifact@v4
        with:
          name: comfy-ltx-candidate
          path: dist
          run-id: ${{ inputs.publish_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the selected bytes and their build attestation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ inputs.publish_sha256 }}
        run: |
          set -euo pipefail
          python -m scripts.verify_comfy_ltx_promotion dist "$EXPECTED_SHA256" > verified-wheel.txt
          gh attestation verify "$(cat verified-wheel.txt)" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/comfy-ltx-wheel.yml" \
            --source-digest "$(cat source-head.txt)" --deny-self-hosted-runners > /dev/null
      - uses: astral-sh/setup-uv@v6
      - name: Publish the exact owned wheel to the append-only Foxlight index
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run --no-project --with boto3 python scripts/publish_wheel_index.py "$(cat verified-wheel.txt)"
