# Builds Skulk's Foxlight-owned Python forks (today: mlx-lm) as wheels from
# their exact pinned commits and publishes them to the Foxlight PEP 503 index
# (wheels.foxlight.ai). Skulk pins these wheels instead of git sources: a git
# source makes every fresh install fetch the fork's entire history (mflux's is
# about 177 MB) only to build one commit, while a published wheel is one small
# file pinned by hash in uv.lock.
#
# The wheel is the pinned commit's code; the only change is the version line,
# stamped to the Foxlight build version (`<upstream>.postN`) so the wheel can
# never be mistaken for, or collide with, an upstream release. A fork whose
# version comes from setuptools-scm (mlx-lm since upstream #1916 generates
# `_version.py` at build time) is stamped through
# `SETUPTOOLS_SCM_PRETEND_VERSION_FOR_<DIST>`; a fork with a committed version
# line is stamped by rewriting that line. mflux needs no fork since upstream
# 0.19.2 lifted its mlx cap, and installs from PyPI. The index is
# append-only: a published version is never rebuilt or replaced, so moving a
# fork to a new commit means a new `.postN` here and in pyproject.toml.
#
# Build runs on pull requests and dev pushes that touch this workflow or the
# pins in pyproject.toml; PUBLISH runs only on manual dispatch with
# publish=true (cutting a wheel release is a deliberate act).
name: fork-wheel

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the fork wheels to the Foxlight R2 index"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/fork-wheel.yml"
      - "pyproject.toml"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/fork-wheel.yml"
      - "pyproject.toml"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - distribution: mlx-lm
            wheel_name: mlx_lm
            repository: Foxlight-Foundation/mlx-lm
            # v0.32.2 plus the two carried deltas (fork PR #4).
            commit: f2f4932ea29c5fe4e4fba017935f3f53a7be28bd
            upstream_version: "0.32.2"
            version: "0.32.2.post1"
            version_file: mlx_lm/_version.py
            # setuptools-scm writes this line from its template
            # (`__version__ = {version!r}`), hence the single quotes.
            version_line: "__version__ = '{}'"
            scm_pretend_env: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_MLX_LM
    env:
      DISTRIBUTION: ${{ matrix.distribution }}
      WHEEL_NAME: ${{ matrix.wheel_name }}
      FORK_COMMIT: ${{ matrix.commit }}
      UPSTREAM_VERSION: ${{ matrix.upstream_version }}
      BUILD_VERSION: ${{ matrix.version }}
      VERSION_FILE: ${{ matrix.version_file }}
      VERSION_LINE: ${{ matrix.version_line }}
      SCM_PRETEND_ENV: ${{ matrix.scm_pretend_env }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: skulk

      - name: Guard Skulk's pin
        run: |
          set -euo pipefail
          # Skulk must install exactly the version this job builds, and only
          # from the Foxlight index; a pin that drifts from this table would
          # publish a wheel nothing installs, or install one nobody built.
          grep -qF "\"${DISTRIBUTION}==${BUILD_VERSION}\"" skulk/pyproject.toml
          grep -qE "^${DISTRIBUTION} = \{ index = \"foxlight\" \}" skulk/pyproject.toml

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: fork
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the fork commit
        run: test "$(git -C fork rev-parse HEAD)" = "$FORK_COMMIT"

      - uses: astral-sh/setup-uv@v6

      - name: Build the untouched commit for comparison
        run: |
          set -euo pipefail
          # What a git source would have installed: the same commit, built by
          # its own backend, before any stamp. The published wheel must match
          # it except for the version.
          cp -a fork pristine-src
          cd pristine-src
          # A setuptools-scm fork cannot derive its version from a depth-1
          # checkout (no tags), so pin it to the upstream release explicitly.
          if [ -n "$SCM_PRETEND_ENV" ]; then export "$SCM_PRETEND_ENV=$UPSTREAM_VERSION"; fi
          uv build --wheel --out-dir ../pristine
          ls -la ../pristine

      - name: Stamp the Foxlight build version
        if: matrix.scm_pretend_env == ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          path = pathlib.Path("fork") / os.environ["VERSION_FILE"]
          line = os.environ["VERSION_LINE"]
          upstream = line.format(os.environ["UPSTREAM_VERSION"])
          stamped = line.format(os.environ["BUILD_VERSION"])
          text = path.read_text(encoding="utf-8")
          # Anchor on the whole line: a looser match could also rewrite an
          # unrelated field that merely ends in the same text.
          pattern = re.compile("^" + re.escape(upstream) + "$", re.MULTILINE)
          if len(pattern.findall(text)) != 1:
              sys.exit(f"expected exactly one line {upstream!r} in {path}")
          path.write_text(pattern.sub(stamped, text), encoding="utf-8")
          print(f"{path}: {upstream} -> {stamped}")
          PY

      - name: Build wheel
        run: |
          set -euo pipefail
          cd fork
          if [ -n "$SCM_PRETEND_ENV" ]; then export "$SCM_PRETEND_ENV=$BUILD_VERSION"; fi
          uv build --wheel --out-dir ../dist
          ls -la ../dist

      - name: Verify the wheel differs from the commit only in its version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import email
          import os
          import pathlib
          import sys
          import zipfile

          distribution = os.environ["DISTRIBUTION"]
          wheel_name = os.environ["WHEEL_NAME"]
          upstream = os.environ["UPSTREAM_VERSION"]
          version = os.environ["BUILD_VERSION"]
          version_file = os.environ["VERSION_FILE"]
          line = os.environ["VERSION_LINE"]


          def read_wheel(directory: str, wheel_version: str) -> tuple[dict[str, bytes], dict[str, bytes]]:
              """Return a wheel's package files and its dist-info files by basename."""

              expected = f"{wheel_name}-{wheel_version}-py3-none-any.whl"
              wheels = sorted(pathlib.Path(directory).glob("*.whl"))
              if [wheel.name for wheel in wheels] != [expected]:
                  sys.exit(f"expected only {expected} in {directory}, found {[wheel.name for wheel in wheels]}")
              info_prefix = f"{wheel_name}-{wheel_version}.dist-info/"
              with zipfile.ZipFile(wheels[0]) as archive:
                  files = {name: archive.read(name) for name in archive.namelist() if not name.endswith("/")}
              package = {name: data for name, data in files.items() if not name.startswith(info_prefix)}
              info = {name.removeprefix(info_prefix): data for name, data in files.items() if name.startswith(info_prefix)}
              return package, info


          pristine_package, pristine_info = read_wheel("pristine", upstream)
          built_package, built_info = read_wheel("dist", version)

          metadata = email.message_from_bytes(built_info["METADATA"])
          if metadata["Name"].replace("_", "-").lower() != distribution:
              sys.exit(f"wheel names {metadata['Name']!r}, expected {distribution}")
          if metadata["Version"] != version:
              sys.exit(f"wheel declares version {metadata['Version']!r}, expected {version}")

          if set(built_package) != set(pristine_package):
              sys.exit(
                  "package files differ: only in the build "
                  f"{sorted(set(built_package) - set(pristine_package))[:5]}, only in the commit "
                  f"{sorted(set(pristine_package) - set(built_package))[:5]}"
              )
          stamped_line = line.format(version).encode()
          upstream_line = line.format(upstream).encode()
          for name, data in sorted(built_package.items()):
              # The stamped version file is the one permitted difference.
              comparable = data.replace(stamped_line, upstream_line) if name == version_file else data
              if comparable != pristine_package[name]:
                  sys.exit(f"{name} differs from the commit's own build")

          # RECORD carries per-file hashes and WHEEL the builder's identity;
          # every other dist-info file (entry points, licenses, top-level
          # names, requirements) must match apart from METADATA's version.
          ignored = {"RECORD", "WHEEL"}
          if set(built_info) - ignored != set(pristine_info) - ignored:
              sys.exit(f"dist-info files differ: {sorted(set(built_info) ^ set(pristine_info))}")
          for name in sorted(set(built_info) - ignored):
              data = built_info[name]
              if name == "METADATA":
                  data = data.replace(f"Version: {version}\n".encode(), f"Version: {upstream}\n".encode())
              if data != pristine_info[name]:
                  sys.exit(f"dist-info {name} differs from the commit's own build")
          print(
              f"{wheel_name}-{version}: {len(built_package)} package files and "
              f"{len(built_info)} dist-info files match the commit except the version"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distribution }}-fork-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  publish-index:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    # Every wheel workflow regenerates the one shared index from the bucket's
    # contents, so publications serialize across workflows.
    concurrency:
      group: foxlight-engine-wheel-index-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-fork-wheel"
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@v6
      - name: Publish wheels to the Foxlight index
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          ls -la dist
          uv run --no-project --with boto3 python scripts/publish_wheel_index.py dist/*.whl
