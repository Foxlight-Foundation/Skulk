[package]
name = "networking"
version = { workspace = true }
edition = { workspace = true }
publish = false

[lib]
doctest = false
name = "networking"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# datastructures
either = { workspace = true }
zenoh = { workspace = true }

# macro dependencies
extend = { workspace = true }
delegate = { workspace = true }

# async
async-stream = { workspace = true }
futures-lite = { workspace = true }
futures-timer = { workspace = true }
tokio = { workspace = true, features = ["full"] }

# utility dependencies
util = { workspace = true }
tracing-subscriber = { version = "0.3.19", features = [
  "default",
  "env-filter",
] }
keccak-const = { workspace = true }

# tracing/logging
log = { workspace = true }

# networking
libp2p = { workspace = true, features = ["full"] }
pin-project = "1.1.10"

# data-plane trust: the Zenoh mutual-TLS authority is derived from the libp2p
# pre-shared key (src/data_plane_trust.rs). All of these already ship in the
# dependency graph through libp2p and zenoh's TLS link.
base64 = "0.22"
hkdf = "0.12"
rcgen = "0.14"
sha2 = "0.10"
zeroize = "1.8"

[dev-dependencies]
# Certificate-chain verification in the trust derivation tests, with the same
# provider zenoh's TLS link uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
